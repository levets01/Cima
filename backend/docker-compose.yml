# Solo para desarrollar la API por separado; Cima de escritorio no utiliza Docker.
services:
  backend:
    build: .
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      NODE_ENV: development
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      DATABASE_URL: file:/app/data/cima.db
      JWT_SECRET: ${JWT_SECRET:-cambia_este_secreto_en_produccion}
      SEED_EMAIL: ${SEED_EMAIL:-rosita@cima.com}
      SEED_PASSWORD: ${SEED_PASSWORD:-Cima2025!}
      SEED_NAME: ${SEED_NAME:-Rosita}
      SEED_DEMO: ${SEED_DEMO:-false}
    ports:
      - '127.0.0.1:4000:4000'
    volumes:
      - cima_data:/app/data
volumes:
  cima_data:

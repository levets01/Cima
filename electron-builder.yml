appId: co.cima.prestamos
productName: Cima
copyright: Copyright © Cima
asar: true
npmRebuild: false
afterPack: desktop/after-pack.cjs
directories:
  app: .desktop-app
  output: release
files:
  - desktop/**/*
  - dist/**/*
  - package.json
  - '!node_modules{,/**/*}'
extraResources:
  - from: .desktop-backend
    to: backend
    filter:
      - '**/*'
      - '!**/.cache/**'
      - '!**/*.test.*'
      - '!**/*.db'
  - from: .desktop-backend/node_modules
    to: backend/node_modules
    filter:
      - '**/*'
      - '!.bin{,/**/*}'
      - '!**/.cache/**'
win:
  icon: desktop/resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  signExecutable: false
  artifactName: Cima-${version}-win-${arch}.${ext}
  requestedExecutionLevel: asInvoker
nsis:
  artifactName: Cima-${version}-Setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Cima
  deleteAppDataOnUninstall: false
  installerIcon: desktop/resources/icon.ico
  uninstallerIcon: desktop/resources/icon.ico
  installerHeaderIcon: desktop/resources/icon.ico
  installerLanguages: [es_ES]
  installMode: currentUser
  runAfterFinish: true
  language: 3082

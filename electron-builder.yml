appId: co.cima.prestamos
productName: Cima
copyright: Copyright © Cima
asar: true
npmRebuild: false
afterPack: desktop/after-pack.cjs
directories:
  app: .desktop-app
  output: release
files:
  - desktop/**/*
  - dist/**/*
  - package.json
  - '!node_modules{,/**/*}'
extraResources:
  - from: .desktop-backend
    to: backend
    filter:
      - '**/*'
      - '!**/.cache/**'
      - '!**/*.test.*'
      - '!**/*.db'
  - from: .desktop-backend/node_modules
    to: backend/node_modules
    filter:
      - '**/*'
      - '!.bin{,/**/*}'
      - '!**/.cache/**'
# The NSIS block is intentionally omitted: this project builds the portable zip with
# electron-builder and then compiles the final Windows installer with Inno Setup.
# NSIS-specific config is only valid for electron-builder's own NSIS target.
win:
  icon: desktop/resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  signExecutable: false
  artifactName: Cima-${version}-win-${arch}.${ext}
  requestedExecutionLevel: asInvoker
